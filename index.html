<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>躲B球辦事處</title>
  <meta name="description" content="躲B球辦事處的公告欄、辦事須知與服務窗口。">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#board">跳到公告欄</a>
  <p id="notice" class="notice" role="status" hidden></p>

  <header class="top">
    <div class="wrap">
      <a class="brand" href="#top"><span id="brandName">躲B球辦事處</span></a>
      <div class="top-right">
        <nav class="nav" aria-label="頁面導覽">
          <a href="#board">公告欄</a>
          <a href="#windows" data-nav="windows" hidden>服務窗口</a>
          <a href="#rules" data-nav="rules" hidden>辦事須知</a>
          <a href="#info" data-nav="info" hidden>辦公時間與連結</a>
        </nav>
        <a class="enter" href="admin.html">進入後台</a>
      </div>
    </div>
  </header>

  <main id="top" class="wrap">
    <section id="hero" class="hero" aria-label="辦事處簡介" hidden>
      <div>
        <div class="sign">
          <h1 id="officeName">躲B球辦事處</h1>
          <p id="tagline" class="tagline" hidden></p>
        </div>
        <p id="welcome" class="welcome" hidden></p>
      </div>

      <a id="called" class="called" href="#board">
        <p class="called-head">最新公告</p>
        <div class="called-body">
          <p id="calledNo" class="called-no" role="img" aria-label="載入中">---</p>
          <p id="calledTitle" class="called-title">載入中…</p>
          <p id="calledDate" class="called-date"></p>
        </div>
      </a>
    </section>

    <section id="wall" class="wall" aria-roledescription="carousel" aria-label="圖片牆" hidden>
      <div class="wall-frame">
        <div id="wallStage" class="wall-stage"></div>
        <button id="wallSound" type="button" class="wall-sound" aria-label="聲音" aria-pressed="true" data-state="on" hidden>
          <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
        </button>
      </div>
      <div id="wallDots" class="wall-dots" role="group" aria-label="切換圖片" hidden></div>
    </section>

    <section id="board" class="section" aria-labelledby="boardTitle">
      <div class="section-head">
        <h2 id="boardTitle" class="plate">公告欄</h2>
        <div id="filters" class="filters" role="group" aria-label="依分類篩選公告" hidden></div>
      </div>
      <ol id="list" class="tickets">
        <li><p class="empty">載入公告中…</p></li>
      </ol>
    </section>

    <section id="windows" class="section" aria-labelledby="windowsTitle" hidden>
      <div class="section-head"><h2 id="windowsTitle" class="plate">服務窗口</h2></div>
      <ul id="windowList" class="windows"></ul>
    </section>

    <section id="rules" class="section" aria-labelledby="rulesTitle" hidden>
      <div class="section-head"><h2 id="rulesTitle" class="plate">辦事須知</h2></div>
      <ol id="ruleList" class="articles"></ol>
    </section>

    <section id="info" class="section" aria-labelledby="infoTitle" hidden>
      <div class="section-head"><h2 id="infoTitle" class="plate">辦公時間與連結</h2></div>
      <div class="info">
        <div id="hoursBox" hidden>
          <h3>辦公時間</h3>
          <p id="hours"></p>
        </div>
        <div id="linksBox" hidden>
          <h3>相關連結</h3>
          <ul id="linkList" class="links"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer id="foot" class="foot" hidden>
    <div class="wrap">
      <p id="footerText"></p>
    </div>
  </footer>

  <script type="module" src="js/public.js"></script>
  <noscript><p class="notice">這個網站需要啟用 JavaScript 才能顯示公告。</p></noscript>
</body>
</html>
